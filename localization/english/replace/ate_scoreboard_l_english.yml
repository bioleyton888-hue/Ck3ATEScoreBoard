 # ---------------------------------------------------------------- CoA tooltips
 ATE_SB_TALANQUE_DESC:0 "#T House Talanque#!\nEmperors of California\n\nElton the Lawgiver, a philosopher who avenged his murdered lord, used Cetic philosophy to unite the warring states of California and end centuries of chaos."
 ATE_SB_JACARANDA_DESC:0 "#T House Jacaranda#!\nKings of Mexico\n\nRose from the streets of Mexico City to restore the Mexican Empire, universally recognised as a continuation of pre-Event Mexico.\n\n#low (ATE defines no coat of arms for this house — CK3 generates one at runtime.)#!"
 ATE_SB_ROYALL_DESC:0 "#T House Royall#!\nEmperors of the Holy Columbian Confederacy\n\nLeonidas Royall united the warring Evangelical South against millenarian Postadventist zealots, founding an empire claiming succession to Old America."
 ATE_SB_CLINTON_DESC:0 "#T House Clinton#!\nKings of Hudsonia\n\nEllis I Clinton marched north from Manhattan to reclaim New York State from the Occultist kingdom of New England, ruling the Hudson Valley for centuries.\n\n#low (ATE defines no coat of arms for this house — CK3 generates one at runtime.)#!"
 ATE_SB_SULLY_DESC:0 "#T House Sully#!\nKings of Moskitia\n\nFounded by the legendary King Newman, said to have lived over 300 years — an unparalleled feat in the post-Event world. One of the oldest and most stable kingdoms in Central America."
 ATE_SB_ABBAS_DESC:0 "#T House Abbas#!\nRulers of Socal\n\nZakariyya I established Socal and codified Imamite doctrine from pre-Event understandings of Islam. They were later overthrown by their own vassals, House Carmine."
 ATE_SB_TLGUNGHUNG_DESC:0 "#T House Tlgunghung#!\nKings of the Haida Tlagaang\n\nDescended from the mythic King Yahguaas, they united the fractious Haida and spread the Raven Deluge faith across the Pacific Northwest."
 ATE_SB_NOKONA_DESC:0 "#T House Nokona#!\nKings of Comancheria\n\nPahayoko I led the Comanche to break free of the reservations and reclaim their homeland in Texas, forming a stable feudal kingdom.\n\n#low (ATE defines no coat of arms for this house — CK3 generates one at runtime.)#!"
 ATE_SB_MAHONIC_DESC:0 "#T House Mahonic#!\nKings of New England\n\nVincent Mahonic united the Occultist tribes of New England into one feared realm. His empire fractured after his assassination and his son's defeat at Saratoga Springs."
 ATE_SB_CASTEL_DESC:0 "#T House Castel#!\nOf Quebec\n\nQueen Véronique united Quebec in the mid-2500s, finally achieving the dream of an independent Quebec. Her kingdom did not outlive her, though her descendants still hold minor titles."
 ATE_SB_PITCHSTONE_DESC:0 "#T House Pitchstone#!\nAmericanist kings of Dakota\n\nNed Pitchstone avenged a slain President and consolidated Americanist rule in the Midwest. His daughter Margaret was the first woman elected to the Presidency, but a Sioux resurgence ended the dynasty."
 ATE_SB_YODER_DESC:0 "#T House Yoder#!\nOf Pennsylvania\n\nUnited much of Pennsylvania under Deitsch rule. The line was wiped out when the childless Kaynich Abram II was murdered by Americanists, setting off a long cycle of retribution.\n\n#low (ATE defines no coat of arms for this house — CK3 generates one at runtime.)#!"
 ATE_SB_TAGOTOKA_DESC:0 "#T House Tagötöka#!\nHigh Chieftains of the Northern Basin\n\nTavibo, 'The Holy' to his adherents and 'The Mad' to his enemies, preached a philosophy drawn from Cetic, Gaian and Mormon teachings and conquered eastern Oregon. His empire was divided among his children."
 ATE_SB_SOADY_DESC:0 "#T House Soady#!\nRaiders of Superior\n\nAlbert Soady embarked from Marquette with hundreds of longships, exacting tribute from every city down the Mississippi and up the East Coast. He united the Jarls of Superior, but the kingdom did not last beyond his death."
 ATE_SB_AVONDALE_DESC:0 "#T House Avondale#!\nPresidents of Chicago\n\nA wealthy and influential Americanist dynasty that produced three Presidents over 200 years. Brought to a violent end by Albert Soady, who sacked Chicago and sacrificed President Anatol Avondale and his family."
 ATE_SB_RAMSESOVICH_DESC:0 "#T House Ramsesovich#!\nThe Pharaoh of the Swamp\n\nRamses Ramsesovich was a minor bandit warlord and leper in the swamps of SoFlo, who rallied his 'mummy armies' — fellow lepers — to found a new Egypt.\n\nHis veracity as a real person, and his ultimate fate, remain disputed. Most sources agree only that his reign of terror was ended swiftly at the hands of the real lords of his so-called Undead Empire. Given his condition, his lineage died with him."
