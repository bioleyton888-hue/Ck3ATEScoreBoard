l_english:
 ATE_SCOREBOARD_BUTTON:0 "Legacy Scoreboard"
 ATE_SCOREBOARD_BUTTON_TT:0 "Compare your dynasty's standing against the great historical houses of the post-Event world."
 ATE_SCOREBOARD_HEADER:0 "The Final Reckoning"
 ATE_SCOREBOARD_CLOSE:0 "Close"
 ATE_SCOREBOARD_LADDER_HEADER:0 "#T The Great Houses of the Post-Event World#!"

 ATE_SCOREBOARD_YOUR_SCORE:0 "House [Dynasty.GetName] ended with a score of #high [SuccessionEventWindow.GetDeadCharacter.MakeScope.ScriptValue('ate_scoreboard_score')|0]#!.\n#low [Dynasty.GetPrestige|0] [dynasty_prestige|E] unspent, plus every point ever spent on [Dynasty.GetNumberOfLegacies|0] legacy perk(s).#!"

 # ---------------------------------------------------------------- headline
 # Exactly one of these renders, picked by score band.
 ATE_SB_HEAD_NONE:0 "#low Your dynasty left no mark upon the post-Event world. Not one of the great houses would recognise your name.#!"
 ATE_SB_HEAD_RAMSESOVICH:0 "You surpassed #high House Ramsesovich#!, the Pharaoh of the Swamp.\n\n#low Ramses Ramsesovich was a minor bandit warlord and leper who rallied his 'mummy armies' in the swamps of SoFlo to found a new Egypt. His reign of terror was ended swiftly by the real lords of his Undead Empire, ending his ambitions and lineage as soon as it started.#!"
 ATE_SB_HEAD_AVONDALE:0 "You surpassed #high House Avondale#!.\n#low An influential Americanist dynasty that produced three Presidents over 200 years, ended violently when Albert Soady sacked Chicago and sacrificed the family.#!"
 ATE_SB_HEAD_SOADY:0 "You surpassed #high House Soady#!.\n#low The Viking raider Albert Soady sacked his way down the Mississippi and up the East Coast, but his kingdom of Superior did not survive him.#!"
 ATE_SB_HEAD_TAGOTOKA:0 "You surpassed #high House Tagötöka#!, High Chieftains of the Northern Basin.\n#low Tavibo, 'The Holy' to his adherents and 'The Mad' to his enemies, conquered eastern Oregon on a syncretic philosophy; his empire split among his heirs.#!"
 ATE_SB_HEAD_YODER:0 "You surpassed #high House Yoder#! of Pennsylvania.\n#low United much of Pennsylvania under Deitsch rule, then was wiped out in a cycle of Americanist-Anabaptist violence following a childless king's murder.#!"
 ATE_SB_HEAD_PITCHSTONE:0 "You surpassed #high House Pitchstone#!, Americanist kings of Dakota.\n#low Ned Pitchstone avenged a slain President and consolidated Americanist rule in the Midwest, before a Sioux resurgence ended the dynasty.#!"
 ATE_SB_HEAD_CASTEL:0 "You surpassed #high House Castel#! of Quebec.\n#low Queen Véronique briefly united an independent Quebec; her line did not outlive her, though her descendants still hold minor titles.#!"
 ATE_SB_HEAD_MAHONIC:0 "You surpassed #high House Mahonic#!, Kings of New England.\n#low Vincent Mahonic united the Occultist tribes of New England; his empire fractured after his assassination and his son's defeat at Saratoga Springs.#!"
 ATE_SB_HEAD_NOKONA:0 "You surpassed #high House Nokona#!, Kings of Comancheria.\n#low Pahayoko I led the Comanche to reclaim their homeland in Texas, forming a stable feudal kingdom that endures to this day.#!"
 ATE_SB_HEAD_TLGUNGHUNG:0 "You surpassed #high House Tlgunghung#!, Kings of the Haida Tlagaang.\n#low Descended from the mythic King Yahguaas, they united the Haida and spread the Raven Deluge faith across the Pacific Northwest.#!"
 ATE_SB_HEAD_ABBAS:0 "You surpassed #high House Abbas#!, rulers of Socal.\n#low Zakariyya I established Socal and codified Imamite doctrine; they were later overthrown by their own vassals, House Carmine.#!"
 ATE_SB_HEAD_SULLY:0 "You surpassed #high House Sully#!, Kings of Moskitia.\n#low Founded by the legendary King Newman, said to have lived over 300 years; one of the oldest and most stable kingdoms in Central America.#!"
 ATE_SB_HEAD_CLINTON:0 "You surpassed #high House Clinton#!, Kings of Hudsonia.\n#low Ellis I Clinton marched north from Manhattan to reclaim New York State from the Occultist kingdom of New England, ruling the Hudson Valley for centuries.#!"
 ATE_SB_HEAD_ROYALL:0 "You surpassed #high House Royall#!, Emperors of the Holy Columbian Confederacy.\n#low Leonidas Royall united the warring Evangelical South against millenarian Postadventist zealots, founding an empire claiming succession to Old America.#!"
 ATE_SB_HEAD_JACARANDA:0 "You surpassed #high House Jacaranda#!, Kings of Mexico.\n#low They rose from the streets of Mexico City to restore the Mexican Empire, universally recognised as a continuation of pre-Event Mexico.#!"
 ATE_SB_HEAD_TALANQUE:0 "You surpassed #high House Talanque#!, Emperors of California — the greatest dynasty of the post-Event world.\n#low Elton the Lawgiver, a philosopher who avenged his murdered lord, used Cetic philosophy to unite the warring states of California and end centuries of chaos.#!"

